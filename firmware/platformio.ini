; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3-185b
src_dir = boards
lib_dir = libraries

[env]
extra_scripts = pre:scripts/select_src.py
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Native USB CDC may change COM number when entering download mode.
upload_speed = 460800
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.arduino.psram_type = opi
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-I include
	-I libraries/miniz_compat
lib_ldf_mode = deep+
lib_deps = 
	https://github.com/richgel999/miniz.git

[env:esp32s3-185b]
; Waveshare 1.85B uses ESP32-S3R8: 16 MB Quad flash and 8 MB Octal PSRAM.
; The generic esp32-s3-devkitc-1 board is the N8/no-PSRAM variant.
board = esp32-s3-devkitc1-n16r8
build_flags = 
	${env.build_flags}
	-DMOTONAV_BOARD_185B=1
	-I boards/185b/MotoNav
lib_deps =
    ${env.lib_deps}

[env:esp32c3_128x160]
board = airm2m_core_esp32c3
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
board_build.arduino.memory_type = dio_qspi
board_build.arduino.psram_type = disabled
build_flags = 
	${env.build_flags}
	-DMOTONAV_BOARD_AIRM2M=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-I boards/esp32c3_128x160/MotoNav
