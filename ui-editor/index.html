<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoNav UI Studio</title><link rel="stylesheet" href="editor.css"></head>
<body>
<header class="topbar"><div class="brand"><div class="brandMark">M</div><div><strong id="brandTitle">MotoNav UI Studio</strong><small id="brandSub">Android 与 ESP32 双模式编辑器</small></div></div><div class="topActions"><label class="selectWrap"><span>模式</span><select id="mode"><option value="android">Android App</option><option value="firmware">ESP32 圆屏</option></select></label><label class="selectWrap"><span id="deviceLabel">设备</span><select id="device"></select></label><button class="ghost" id="resetPage">重置页面</button><button class="primary" id="saveBtn">保存项目</button><button class="iconBtn" id="exportBtn">↥</button></div></header>
<main class="workspace">
<aside class="sidebar leftPanel"><div class="panelTitle"><h2 id="pageHeading">App 页面</h2><button class="tinyBtn" id="addPage">＋</button></div><nav class="pages" id="pages"></nav><div class="divider"></div><div class="panelTitle"><h2 id="controlHeading">Android 控件</h2><span class="muted">点击添加</span></div><div class="toolGrid" id="tools"></div></aside>
<section class="stage"><div class="stageBar"><div><strong id="screenTitle">首页</strong><span id="screenMeta"></span></div><div class="stageTools"><button class="iconBtn" id="zoomOut">−</button><span id="zoomLabel">70%</span><button class="iconBtn" id="zoomIn">＋</button><button class="iconBtn" id="fitBtn">⌗</button></div></div><div class="canvasArea"><div class="phoneFrame" id="deviceFrame"><div class="phoneStatus" id="phoneStatus"><span>9:41</span><span>●●● ▰</span></div><canvas id="canvas"></canvas><div class="phoneNav" id="phoneNav"><i></i></div></div></div><div class="stageFooter"><span><i class="statusDot"></i><span id="statusLabel">本地草稿</span></span><span id="coord">X 0 · Y 0</span></div></section>
<aside class="sidebar rightPanel"><div class="inspectorHead"><div><h2>属性</h2><span id="selectionName">未选择控件</span></div><button class="iconBtn" id="deleteBtn">⌫</button></div><div id="emptyInspector" class="emptyInspector"><div class="emptyIcon">✦</div><strong>选择一个控件</strong><span>在画布或图层中选择后编辑</span></div><form id="form" hidden><div class="layerName"><span id="layerType">文本</span><strong id="layerLabel">控件</strong></div><div class="formSection"><label>位置<div class="two"><input id="fX" type="number"><input id="fY" type="number"></div></label><label>尺寸<div class="two"><input id="fW" type="number"><input id="fH" type="number"></div></label></div><div class="formSection"><label>文字 / 内容<input id="fText"></label><label>颜色<input id="fColor" type="color"></label><label>字号<input id="fSize" type="number"></label><label id="radiusField">圆角<input id="fRadius" type="number"></label><label id="directionField">方向<select id="fDir"><option value="S">S · 直行</option><option value="L">L · 左转</option><option value="R">R · 右转</option><option value="U">U · 掉头</option><option value="A">A · 到达</option></select></label></div><button type="button" class="applyBtn" id="apply">应用更改</button></form><div class="layersHead"><h2>页面图层</h2><span id="layerCount">0 项</span></div><div class="layers" id="layers"></div><div class="exportHint" id="exportHint">导出 Android XML、Compose 示例或 JSON。</div></aside></main>
<dialog id="output"><button class="close iconBtn" id="closeExport">×</button><h2 id="outputTitle">导出布局</h2><div class="dialogTabs" id="exportTabs"></div><textarea id="outText" spellcheck="false"></textarea><button class="primary dialogSave" id="downloadBtn">下载文件</button></dialog><div class="toast" id="toast"></div><script src="android-editor.js"></script><script src="firmware-editor.js"></script>
</body></html>
